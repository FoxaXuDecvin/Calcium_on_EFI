//BuildShell SipCfg  --Use  true/false
$CalciumVersion=121.4.3.6;
$EnableSystemCommand=false;
$EnableAntiCrash=false;
$EnableCrashReload=false;
$AllowDirectoryEdit=false;
$AllowThirdPartyPlugin=false;
$AllowShellEdit=false;
$AllowScriptEdit=true;
$UseDirectRead=false;
$TrustedServerCheck=false;
$OffLangCheck=true;
$MaxScriptExecuteLine=2147483640;
$AfterExecuteSleepTime=0;
$VarSpaceRandomError=0;
$LockingRunningScript=false;

//ShellSettings
$AutoOpenShellAfterRun=false;
$UseSuperUser=false;

//Bind
$AutoRun=null;
$AutoRunArgs=null;

//PathBind
$DefaultPluginPath={path}/Plugin;
$DefaultPluginScript={path}/script;
$DefaultLanguagePath={path}/lang;
$PageFile={path}/envswap.tmp;
$OriginWorkDir=/;

//Display Settings
$Language=en-us;
$SecondLanguage=en-us;

//Windows Only
$EnforceUTF-8=true;

//Server
$RootAPIServer=http://githubimage.foxaxu.top;
$ExecuteFile=\EFI\BOOT\BOOTX64.EFI;

$Configuration File Integrity Check=vaild;
